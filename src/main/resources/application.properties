spring.application.name=sicc
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
sicc.jwt.secret=${SICC_JWT_SECRET}
sicc.jwt.expiration-seconds=${SICC_JWT_EXPIRATION_SECONDS:28800}
sicc.bootstrap.login=${SICC_BOOTSTRAP_LOGIN:}
sicc.bootstrap.password=${SICC_BOOTSTRAP_PASSWORD:}
sicc.bootstrap.email=${SICC_BOOTSTRAP_EMAIL:}
sicc.bootstrap.name=${SICC_BOOTSTRAP_NAME:Administrador SICC}
sicc.storage.directory=${SICC_STORAGE_DIRECTORY:./data/storage}
