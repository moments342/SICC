services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sicc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SICC_DB_PASSWORD:-sicc}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sicc"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - sicc-postgres:/var/lib/postgresql/data

volumes:
  sicc-postgres:
